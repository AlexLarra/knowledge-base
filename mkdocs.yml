site_name: knowledge-base
site_url: https://alexlarra.github.io/knowledge-base/
copyright: "&copy; Alexander Larrazabal (alexlarra)"
plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: es
          name: Español
          build: true
        - locale: en
          name: English
          default: true
          build: true
theme:
  name: material
  custom_dir: overrides
  features:
    - navigation.tabs
extra:
  generator: false
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/alexlarra/
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/AlexLarra
      name: GitHub
markdown_extensions:
  - admonition
  - codehilite
extra_css:
  - assets/stylesheets/custom.css
nav:
  - Home: README.md
  - Git:
      - git/why-use-git.md
      - git/git-for-kids-cli.md
  - Tmux:
      - tmux/why-use-tmux.md
      - tmux/use-tmux-for-production-scripts.md
